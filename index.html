<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- 휴대폰이 다크 모드여도 밝은 화면 그대로 (브라우저의 '웹페이지 강제 어둡게'도 막는다) -->
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fbfbfd">
<title>쎈스 디렉터 · Sense Director</title>
<meta name="description" content="영상 원본을 넘기지 않고, 링크 하나로 주고받는 영상 수정 요청 — WesNS">
<!-- 기본은 항상 밝은 화면. 다크 모드는 직접 골랐을 때만 (WesNS 사이트와 같은 저장 키) -->
<script>(function(){try{var d=localStorage.getItem('wesns.theme')==='dark';document.documentElement.classList.toggle('dark',d);if(d){document.querySelector('meta[name=color-scheme]').content='dark';document.querySelector('meta[name=theme-color]').content='#16161c'}}catch(e){}})()</script>
<link rel="icon" type="image/svg+xml" href="assets/brand/wsns-mark.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script type="module" src="assets/js/app.js"></script>
</head>
<body>
<div id="app"><div class="boot" aria-label="쎈스 디렉터 불러오는 중"></div></div>
<noscript>JavaScript를 켜야 쓸 수 있어요. / Please enable JavaScript.</noscript>
</body>
</html>
